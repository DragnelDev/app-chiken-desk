<aside
  class="flex h-screen w-64 flex-col justify-between border-r border-gray-100 bg-surface-light-card p-4
         dark:border-surface-dark-border dark:bg-surface-dark"
>
  <div>
    <!-- Logo / marca -->
    <div class="mb-8 flex items-center gap-2 px-2">
      <div
        class="flex h-9 w-9 items-center justify-center rounded-full bg-brand text-lg"
      >
        🌀
      </div>
      <span class="text-lg font-bold text-gray-900 dark:text-white">{{ brandName() }}</span>
    </div>

    <!-- Navegación -->
    <nav class="flex flex-col gap-1">
      @for (item of items(); track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-brand text-white shadow-sm"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-500
                 transition-colors hover:bg-gray-50
                 dark:text-gray-300 dark:hover:bg-surface-dark-card"
        >
          <span>{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </div>

  <!-- Toggle de modo claro/oscuro -->
  <button
    type="button"
    (click)="toggleTheme()"
    class="flex items-center justify-center gap-2 rounded-lg bg-gray-100 px-3 py-2.5 text-sm font-medium
           text-gray-700 transition-colors hover:bg-gray-200
           dark:bg-surface-dark-card dark:text-gray-200 dark:hover:bg-surface-dark-border"
  >
    <span>{{ theme.theme() === 'dark' ? '☀️' : '🌙' }}</span>
    <span>{{ theme.theme() === 'dark' ? 'Modo Claro' : 'Modo Oscuro' }}</span>
  </button>
</aside>
