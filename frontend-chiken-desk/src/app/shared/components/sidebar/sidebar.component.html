<aside
  class="flex h-screen w-64 shrink-0 flex-col justify-between overflow-y-auto border-r border-gray-100 bg-surface-light-card p-4
         dark:border-surface-dark-border dark:bg-surface-dark"
>
  <div>
    <!-- Marca -->
    <div class="mb-8 flex items-center gap-2 px-2">
      <div class="flex h-9 w-9 items-center justify-center rounded-full bg-brand text-lg">🍗</div>
      <span class="text-lg font-bold text-gray-900 dark:text-white">{{ brandName() }}</span>
    </div>

    <!-- Navegación -->
    <nav class="flex flex-col gap-1">
      @for (item of items(); track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-brand text-white shadow-sm"
          [routerLinkActiveOptions]="{ exact: item.route === '/pos' }"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-500
                 transition-colors hover:bg-gray-50 dark:text-gray-300 dark:hover:bg-surface-dark-card"
        >
          <span>{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </div>

  <div class="mt-6 space-y-2">
    @if (auth.currentUser(); as u) {
      <div class="rounded-lg bg-gray-50 px-3 py-2 text-xs text-gray-500 dark:bg-surface-dark-card dark:text-gray-400">
        <p class="truncate font-semibold text-gray-800 dark:text-gray-100">{{ u.nombres }} {{ u.apellidos }}</p>
        <p>{{ u.rol }}</p>
      </div>
    }
    <button
      type="button"
      (click)="toggleTheme()"
      class="flex w-full items-center justify-center gap-2 rounded-lg bg-gray-100 px-3 py-2.5 text-sm font-medium text-gray-700
             transition-colors hover:bg-gray-200 dark:bg-surface-dark-card dark:text-gray-200 dark:hover:bg-surface-dark-border"
    >
      <span>{{ theme.theme() === 'dark' ? '☀️' : '🌙' }}</span>
      <span>{{ theme.theme() === 'dark' ? 'Modo Claro' : 'Modo Oscuro' }}</span>
    </button>
    <button
      type="button"
      (click)="cerrarSesion()"
      class="flex w-full items-center justify-center gap-2 rounded-lg border border-gray-200 px-3 py-2.5 text-sm font-medium
             text-gray-600 transition-colors hover:bg-gray-50 dark:border-surface-dark-border dark:text-gray-300
             dark:hover:bg-surface-dark-border"
    >
      ↩ Cerrar sesión
    </button>
  </div>
</aside>
