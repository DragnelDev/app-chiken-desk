<!-- Encabezado -->
<div class="mb-8 flex items-center justify-between">
  <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Panel de Control General</h1>
  <span
    class="flex items-center gap-1.5 rounded-full bg-green-100 px-3 py-1 text-xs font-semibold
           text-green-700 dark:bg-green-900/40 dark:text-green-400"
  >
    <span class="h-1.5 w-1.5 rounded-full bg-green-500"></span>
    Sistema Activo
  </span>
</div>

<!-- Tarjetas de métricas -->
<div class="mb-6 grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4">
  <app-stat-card
    label="Ventas de Hoy"
    [value]="ventasFormateadas"
    [hint]="'↑ ' + resumen().variacionVsAyer + '% vs ayer'"
    hintColor="brand"
  />
  <app-stat-card
    label="Mesas Ocupadas"
    [value]="resumen().mesasOcupadas + ' / ' + resumen().mesasTotales"
    [hint]="((resumen().mesasOcupadas / resumen().mesasTotales) * 100 | number: '1.0-0') + '% ocupación'"
    hintColor="amber"
  />
  <app-stat-card
    label="Pedidos Activos"
    [value]="resumen().pedidosActivos + ' Órdenes'"
    hint="Cocina a tiempo"
    hintColor="blue"
  />
  <app-stat-card
    label="Clientes Atendidos"
    [value]="resumen().clientesAtendidos.toString()"
    hint="Promedio alto"
    hintColor="violet"
  />
</div>

<!-- Banner de estado -->
<div
  class="flex items-center justify-between rounded-xl2 bg-surface-light-card p-6 shadow-sm
         dark:bg-surface-dark-card"
>
  <div>
    <h2 class="font-semibold text-gray-900 dark:text-white">Diseño Sincronizado</h2>
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
      Prueba haciendo clic en el botón de la barra lateral para cambiar dinámicamente entre
      el modo claro y oscuro.
    </p>
  </div>
  <button
    type="button"
    class="whitespace-nowrap rounded-lg bg-brand px-5 py-2.5 text-sm font-semibold text-white
           transition-colors hover:bg-brand-hover"
  >
    Ver Órdenes en Vivo
  </button>
</div>
