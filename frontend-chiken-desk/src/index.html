<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>NexusRest</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <!-- El ThemeService añade/quita la clase "dark" aquí antes de pintar, para evitar parpadeos -->
  <script>
    try {
      if (localStorage.getItem('nexusrest-theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
</head>
<body class="bg-surface-light dark:bg-surface-dark transition-colors">
  <app-root></app-root>
</body>
</html>
